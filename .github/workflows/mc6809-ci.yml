# Does this tree build and pass its own tests on a machine that is not
# Mark's Mac?  That is the whole question this workflow answers, and it is
# the one thing a fork of LLVM cannot find out any other way.
#
# What it deliberately does NOT do: roll a bundle, build picolibc, or run
# anything on an emulator.  The acceptance check needs usim, a NitrOS-9
# image tree, and -- for the two DECB cases -- MAME with Tandy's ROMs,
# which cannot live in a public repository.  Those stay a local gate.  See
# llvm/docs/MC6809-Toolchain-Build.md.
name: MC6809 CI

on:
  push:
    branches: [MC6809]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [MC6809]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# A second push supersedes the first; a 50-minute build of a commit nobody
# is looking at any more is 50 minutes of somebody else's electricity.
concurrency:
  group: mc6809-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and MC6809 tests
    # Not on anybody else's fork of this fork.
    if: github.repository == 'markrvmurray/llvm-mc6809'
    runs-on: ubuntu-latest
    # Measured: 2h09 for the first run, of which 2h07 was the build -- a
    # four-vCPU runner takes about three times what an eighteen-core Mac
    # does, and that is with no lldb.  Later runs restore the ccache and
    # should be a fraction of it, but a cold cache plus the bundle roll has
    # to fit, and a run killed by the cap wastes the whole two hours.
    timeout-minutes: 300
    env:
      # Raise this when the suite grows.  It exists because the failure that
      # matters here is not a red test -- it is the whole suite quietly
      # becoming UNSUPPORTED (a lit.local.cfg that stops seeing the target,
      # a clang that no longer knows the triple) and lit then reporting
      # success over nothing.  Measured on 2026-08-22: 240 passed, 56
      # unsupported, 0 failed.
      MIN_PASS: 240
      CCACHE_MAXSIZE: 2G

      # Pinned to a commit, never to a branch: an old tag has to rebuild to
      # the bundle it named, and a branch would quietly change what it means.
      # Bump these in a commit when either dependency moves.
      PICOLIBC_REPO: markrvmurray/picolibc
      PICOLIBC_SHA: 0324312a9cd9b466f4fa63a01390a274d9efb8ed
      USIM_REPO: markrvmurray/usim
      USIM_SHA: bf2e69d9e99ffb6dccd02854a0abcabc022ba912

      # The acceptance check, minus what a runner cannot have.  Measured on
      # 2026-08-22 against 1.0-rc1: 48 pass with everything present, 39 pass
      # and 9 not run without a NitrOS-9 image (six OS-9 cases and the C++
      # OS-9 case) or MAME with Tandy's ROMs (two DECB cases).
      CHECK_MIN_PASS: 39
      CHECK_EXPECT_NOTRUN: 9
      # Says, in advance and in the log, that this is the reduced check.
      MC6809_CHECK_ALLOW_UNRUNNABLE: 1

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # 2.7 GB of repository; no history is needed to compile it.
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              ninja-build ccache clang lld
          cmake --version && ninja --version && ccache --version | head -1

      # Keyed on the commit so it always writes a fresh entry; the prefix
      # restores the nearest previous one, which is what makes the second
      # and later runs quick.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          # The development cache, with the three things a CI build wants
          # different: Release so it finishes, assertions kept ON because
          # catching a bad assumption is most of the value, and no lldb --
          # a fifth of the build, and the bundle ships none of it.
          #
          # -D beats -C: cmake reads the -C file first, and every entry it
          # sets is a plain CACHE set with no FORCE.
          cmake -C clang/cmake/caches/MC6809.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_ENABLE_ASSERTIONS=ON \
              -DLLVM_ENABLE_PROJECTS="clang;lld" \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DLLVM_USE_LINKER=lld \
              -DLLVM_CCACHE_BUILD=ON \
              -DLLVM_PARALLEL_LINK_JOBS=2 \
              -G Ninja -S llvm -B build-ci
          # Prove the overrides took, rather than discovering it 50 minutes
          # from now in a build that quietly included lldb.
          grep -E '^(CMAKE_BUILD_TYPE|LLVM_ENABLE_PROJECTS|LLVM_ENABLE_ASSERTIONS):' \
              build-ci/CMakeCache.txt

      - name: Build
        run: |
          ccache --zero-stats >/dev/null
          # --target all, always: a stale lld breaks LTO links in ways that
          # look like backend bugs.
          cmake --build build-ci --target all
          ccache --show-stats | head -8

      - name: MC6809 test suite
        id: lit
        run: |
          set -o pipefail
          # Every MC6809 test that does not need a machine to run on.  The
          # emulator-driven suites (llvm/test/MC/MC6809/Execution, and the
          # OS-9 runtime cases under compiler-rt) report UNSUPPORTED here
          # because USIM09BATCH and friends are unset -- deliberately, and
          # the count below is what stops that reading as success.
          build-ci/bin/llvm-lit --no-progress-bar -v \
              llvm/test/CodeGen/MC6809 \
              llvm/test/MC/MC6809 \
              clang/test/CodeGen/MC6809 \
              clang/test/Sema/asm-mc6809-*.c \
              clang/test/Sema/mc6809-*.c \
              clang/test/Driver/mc6809*.c \
              2>&1 | tee lit.log

      - name: Check the suite actually ran
        if: always() && steps.lit.outcome != 'skipped'
        run: |
          passed=$(sed -n 's/^ *Passed *: *\([0-9]*\).*/\1/p'      lit.log | tail -1)
          failed=$(sed -n 's/^ *Failed *: *\([0-9]*\).*/\1/p'      lit.log | tail -1)
          unsupp=$(sed -n 's/^ *Unsupported *: *\([0-9]*\).*/\1/p' lit.log | tail -1)
          passed=${passed:-0}; failed=${failed:-0}; unsupp=${unsupp:-0}
          {
            echo "### MC6809 test suite"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| passed | $passed |"
            echo "| failed | $failed |"
            echo "| unsupported (needs an emulator) | $unsupp |"
            echo
            echo "Not covered here: the picolibc build, the rolled bundle,"
            echo "and everything that needs usim, a NitrOS-9 image or MAME"
            echo "with Tandy's ROMs.  Those remain a local gate."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed test(s) failed"; exit 1
          fi
          if [ "$passed" -lt "$MIN_PASS" ]; then
            echo "::error::only $passed tests passed, expected at least $MIN_PASS -- the suite is not running, which is worse than a failure"
            exit 1
          fi
          echo "$passed passed, $unsupp unsupported, 0 failed"

      # ------------------------------------------------------------------
      # Everything below builds an actual bundle and checks it, which is the
      # difference between "the compiler compiles" and "the thing people
      # download works".
      # ------------------------------------------------------------------

      - name: Check out picolibc
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PICOLIBC_REPO }}
          ref: ${{ env.PICOLIBC_SHA }}
          path: _deps/picolibc

      - name: Check out usim
        uses: actions/checkout@v4
        with:
          repository: ${{ env.USIM_REPO }}
          ref: ${{ env.USIM_SHA }}
          path: _deps/usim

      - name: Install picolibc build tools
        run: sudo apt-get install -y --no-install-recommends meson xz-utils

      - name: Build the simulators
        run: |
          # The check refuses to run at all without both of these, and with
          # them the bare-metal cases really execute rather than just link.
          # -Werror is dropped: a warning from a newer g++ than the one this
          # was written against must not fail the build of a test tool.
          make -C _deps/usim -j "$(nproc)" usim09batch usim09pt \
              CXX='g++ --std=c++20 -Wall -Wextra'
          echo "$GITHUB_WORKSPACE/_deps/usim" >> "$GITHUB_PATH"

      - name: Roll a bundle
        run: |
          # The roll builds picolibc eight times with the compiler just built,
          # then checks what it produced and refuses to package a bundle that
          # does not run.
          scripts/roll-toolchain.sh \
              --prefix "$RUNNER_TEMP/mc6809" \
              --llvm-build build-ci \
              --picolibc "$GITHUB_WORKSPACE/_deps/picolibc" \
              --tarball "$RUNNER_TEMP/dist"

      - name: Check the archive, not the prefix it came from
        id: check
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 -c ./*.tar.xz.sha256
          # Unpacked somewhere it was never built: this tests the archive's
          # completeness and the bundle's relocatability at the same time.
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xf ./*.tar.xz -C "$RUNNER_TEMP/unpacked"
          bundle=$(basename ./*.tar.xz .tar.xz)
          "$GITHUB_WORKSPACE/_deps/picolibc/scripts/check-mc6809-toolchain" \
              --corpus "$RUNNER_TEMP/unpacked/$bundle" 2>&1 | tee check.log

      - name: Check the bundle check actually ran
        if: always() && steps.check.outcome != 'skipped'
        run: |
          log=$RUNNER_TEMP/dist/check.log
          [ -f "$log" ] || { echo "::error::no check log"; exit 1; }
          read -r p f n <<EOF
          $(sed -n 's/^pass=\([0-9]*\) fail=\([0-9]*\) not-run=\([0-9]*\).*/\1 \2 \3/p' "$log" | tail -1)
          EOF
          p=${p:-0}; f=${f:-0}; n=${n:-0}
          {
            echo "### Bundle"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| passed | $p |"
            echo "| failed | $f |"
            echo "| not run (no NitrOS-9 image, no CoCo ROMs) | $n |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$f" -ne 0 ]; then echo "::error::$f bundle check(s) failed"; exit 1; fi
          if [ "$p" -lt "$CHECK_MIN_PASS" ]; then
            echo "::error::only $p checks passed, expected at least $CHECK_MIN_PASS -- cases are disappearing rather than failing"
            exit 1
          fi
          # More skipped than expected means something stopped being
          # attempted; the count is the only thing that would show it.
          if [ "$n" -gt "$CHECK_EXPECT_NOTRUN" ]; then
            echo "::error::$n cases were not run, expected $CHECK_EXPECT_NOTRUN"
            exit 1
          fi
          echo "$p passed, $f failed, $n not run"

      - name: Publish the bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mc6809-toolchain-linux-x86_64
          path: |
            ${{ runner.temp }}/dist/*.tar.xz
            ${{ runner.temp }}/dist/*.tar.xz.sha256
          retention-days: 14

      - name: Keep the log when something broke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            lit.log
            ${{ runner.temp }}/dist/check.log
          retention-days: 14
          if-no-files-found: ignore
