# Builds and checks a Windows bundle on demand, through the same workflow a
# release calls (mc6809-windows-bundle.yml).  Publishes nothing: the bundle is
# kept as a run artifact, never attached to anything.
#
# This is how the Windows build is tried outside a release -- before tagging,
# or after a change to the Windows steps -- since a release cannot itself be
# run without cutting one.  Start it from MC6809 (Actions, or
# `gh workflow run mc6809-windows.yml --ref MC6809`); it builds the commit it
# is started on, and may only read the repository.
name: MC6809 Windows bundle (on demand)

on:
  workflow_dispatch:

concurrency:
  group: mc6809-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'markrvmurray/llvm-mc6809'
    uses: ./.github/workflows/mc6809-windows-bundle.yml
    with:
      llvm-ref: ${{ github.sha }}
      # Pinned to a commit, as CI pins it, until a picolibc release tag
      # carries the Windows fixes and the start-up check.
      picolibc-ref: 41e0780b80dab66d9c3a774ad92748a075866b32
      # A release builds clean; an on-demand run carries its compiles over.
      # Its cache is saved on the branch it ran from -- on MC6809, the
      # default branch, where every later run can read it.
      cache: true
