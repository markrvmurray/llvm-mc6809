from lit.llvm import llvm_config
import sys

config.suffixes = [
    ".c",
    ".cpp",
    ".cppm",
    ".h",
    ".m",
    ".mm",
    ".S",
    ".s",
    ".f90",
    ".F90",
    ".f95",
    ".cu",
    ".rs",
    ".cl",
    ".clcpp",
    ".hip",
    ".hipi",
    ".hlsl",
    ".yaml",
    ".test",
]
config.substitutions = list(config.substitutions)
config.substitutions.insert(
    0, ("%clang_cc1", """*** Do not use 'clang -cc1' in Driver tests. ***""")
)

is_windows = sys.platform.startswith("win")
if is_windows:
    config.substitutions.append(('%crash_opt', ''))
else:
    config.substitutions.append(('%crash_opt', '--crash'))

# Remove harmful environmental variables for clang Driver tests.
# Some might be useful for other tests so they are only removed here.
driver_overwrite_env_vars = [
    "MACOSX_DEPLOYMENT_TARGET",
    "IPHONEOS_DEPLOYMENT_TARGET",
    "SDKROOT",
    "CCC_OVERRIDE_OPTIONS",
    "CC_PRINT_OPTIONS",
    "CC_PRINT_HEADERS",
    "CC_LOG_DIAGNOSTICS",
    "CC_PRINT_PROC_STAT",
]

for name in driver_overwrite_env_vars:
    if name in config.environment:
        del config.environment[name]

if llvm_config.use_lld(required=False):
    config.available_features.add("lld")

if config.ppc_linux_default_ieeelongdouble:
    config.available_features.add("ppc_linux_default_ieeelongdouble")

# The OS-9 tools in the repository's tools/ are Python scripts.  Run them
# through the Python that runs lit: Windows cannot start a script by its #!.
import os as _os
_tools = _os.path.join(_os.path.dirname(_os.path.abspath(__file__)), '../../../tools')
for _name in ("os9-link", "os9-module-check"):
    config.substitutions.insert(0, ("%" + _name, '"%s" "%s"' % (config.python_executable, _os.path.join(_tools, _name))))
