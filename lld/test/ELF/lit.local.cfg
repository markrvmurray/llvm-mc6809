config.suffixes = [".test", ".s", ".ll", ".bat", ".yaml"]

# The environment variable DFLTCC=0 disables use of the hardware compression
# facility on SystemZ.  When this facility is enabled, slightly different
# compression results can be seen, which can cause spurious failures in the
# compressed-debug-level.test test case.
if "s390x" in config.host_triple:
    config.environment["DFLTCC"] = "0"

# The OS-9 tools in the repository's tools/ are Python scripts.  Run them
# through the Python that runs lit: Windows cannot start a script by its #!.
import os as _os
_tools = _os.path.join(_os.path.dirname(_os.path.abspath(__file__)), '../../../tools')
for _name in ("os9-link", "os9-module-check"):
    config.substitutions.insert(0, ("%" + _name, '"%s" "%s"' % (config.python_executable, _os.path.join(_tools, _name))))
