import os
import shutil

if not 'MC6809' in config.root.targets:
    config.unsupported = True

# lldb, when this tree built it (LLVM_ENABLE_PROJECTS includes lldb).  The
# tests here read MC6809 objects with it; without it they are unsupported.
lldb = os.path.join(config.llvm_tools_dir, 'lldb')
if os.path.isfile(lldb) and os.access(lldb, os.X_OK):
    config.available_features.add('lldb')
    config.substitutions.append(('%lldb', lldb + ' --no-lldbinit'))

# usim09batch with its gdb-remote server, for tests that debug a running
# program.  Only a usim that offers --gdb-port-file can be driven from a
# test: it picks a free port and says which.
usim = os.environ.get('USIM09BATCH') or shutil.which('usim09batch')
if usim:
    import subprocess
    try:
        usage = subprocess.run([usim], capture_output=True, text=True,
                               timeout=10).stderr
    except Exception:
        usage = ''
    if '--gdb-port-file' in usage:
        config.available_features.add('usim-gdb')
        config.substitutions.append(('%usim09batch', usim))
