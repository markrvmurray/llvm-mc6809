import os
import shutil

if not 'MC6809' in config.root.targets:
    config.unsupported = True

# Find usim09batch: check USIM09BATCH env var, then PATH
usim = os.environ.get('USIM09BATCH') or shutil.which('usim09batch')
if usim:
    config.available_features.add('usim')
    config.substitutions.append(('%usim09batch', usim))
else:
    config.unsupported = True

# Optional: CMOC cross-compiler for live interop tests
cmoc = shutil.which('cmoc')
if cmoc:
    config.available_features.add('cmoc')

# clang for MC6809: used by most execution tests for harness compilation.
clang6809 = os.path.join(config.llvm_tools_dir, 'clang') + ' -target mc6809 -w -fno-builtin'
config.substitutions.append(('%clang6809', clang6809))

# Compiler-rt builtins for MC6809. The execution tests' mc6809rt.s
# carries hand-asm versions of most __*di* / __*si* libcalls, but a
# few (notably __muldi3) only exist in compiler-rt. Provide
# %mc6809_builtins as the absolute path to libclang_rt.builtins.a so
# tests that need it can name it on the ld.lld command line.
import glob
_rt_glob = os.path.join(config.llvm_obj_root, 'lib', 'clang', '*',
                        'lib', 'mc6809*', 'libclang_rt.builtins.a')
_rt_matches = glob.glob(_rt_glob)
if _rt_matches:
    config.substitutions.append(('%mc6809_builtins', _rt_matches[0]))

# Optional: gcc6809 (gcc retargeted for 6809) for cross-compiler interop tests.
# Check $GCC6809 env var first, then PATH, then the well-known install location.
gcc6809 = (os.environ.get('GCC6809')
           or shutil.which('m6809-unknown-gcc')
           or '/usr/local/m6809/bin/m6809-unknown-gcc')
if os.path.isfile(gcc6809) and os.access(gcc6809, os.X_OK):
    config.available_features.add('gcc6809')
    config.substitutions.append(('%gcc6809', gcc6809))

# Bug #194 Phase A: MAME llvm6309 SBC for HD6309 execution tests.
# `mamellvm6309-headless` runs as a true HD6309 (not 6809-compat) and is
# the natural home for any test that exercises HD6309-only opcodes
# (LDMD, MULD, DIVQ, BAND, LDQ, LDW, STW, COME, ...).
#
# The lit substitution `%mamellvm6309` resolves to a wrapper
# (`run-mc6809-mame`, sibling to `mamellvm6309-headless`) that converts
# an ELF to a 64 KB raw cart, runs MAME, returns its stdout/exit code.
# Drop-in equivalent of `%usim09batch <hex>`.
#
# The `mame` feature gates tests that need MAME (e.g. cycle-counting,
# acia-loopback). The `hd6309` feature gates tests that exercise
# HD6309-only instructions — currently equivalent to `mame`, but kept
# distinct so a future second HD6309 simulator (or the 6309 instruction
# subset arriving in usim) can be modelled cleanly.
mame = (os.environ.get('MAMELLVM6309')
        or shutil.which('run-mc6809-mame'))
if mame:
    config.available_features.add('mame')
    config.available_features.add('hd6309')
    config.substitutions.append(('%mamellvm6309', mame))
