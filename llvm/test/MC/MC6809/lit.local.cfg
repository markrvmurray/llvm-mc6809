if not 'MC6809' in config.root.targets:
    config.unsupported = True

# ============================================================
# =========  TEMPORARY — REMOVE WHEN BUG #119 IS FIXED  ======
# ============================================================
# llvm-objdump currently crashes on certain MC6809 disassembly
# (bug #119, ArrayRef OOB in evaluateMemoryOperandAddress). Each
# crash spawns llvm-symbolizer which walks every loaded dylib on
# macOS — tens of seconds per crash. Tests don't need the stack
# trace; silence both so the test suite isn't dominated by the
# crash-report machinery.
#
# !! DELETE THIS BLOCK WHEN #119 IS CLOSED !!
config.environment['LLVM_DISABLE_CRASH_REPORT'] = '1'
config.environment['LLVM_DISABLE_SYMBOLIZATION'] = '1'
# ============================================================
